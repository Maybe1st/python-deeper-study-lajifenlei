{% extends 'base.html' %}
{% block content %}
<h2>模型训练</h2>
<form id="frm">
  <div class="mb-3"><label>epochs</label><input name="epochs" value="5" class="form-control"></div>
  <div class="mb-3"><label>batch_size</label><input name="batch_size" value="32" class="form-control"></div>
  <div class="mb-3"><label>learning_rate</label><input name="learning_rate" value="0.001" class="form-control"></div>
  <button class="btn btn-primary">开始训练</button>
</form>
<div id="msg" class="mt-3"></div>
<script>
document.getElementById('frm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const f = new FormData(e.target);
  const body = {epochs: parseInt(f.get('epochs')), batch_size: parseInt(f.get('batch_size')), learning_rate: parseFloat(f.get('learning_rate'))};
  const r = await fetch('/api/training/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json();
  if(j.code===0) document.getElementById('msg').innerHTML = '<div class="alert alert-success">训练已启动 id='+j.data.training_id+'</div>';
  else document.getElementById('msg').innerHTML = '<div class="alert alert-danger">'+(j.message||'错误')+'</div>';
});
</script>
{% endblock %}
