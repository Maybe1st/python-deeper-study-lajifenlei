<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{ title or '垃圾分类' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">垃圾分类</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
            <li class="nav-item"><a class="nav-link" href="/classify">识别</a></li>
            <li class="nav-item"><a class="nav-link" href="/history">历史</a></li>
            <li class="nav-item"><a class="nav-link" href="/users">用户管理</a></li>
            <li class="nav-item"><a class="nav-link" href="/dataset">数据集</a></li>
            <li class="nav-item"><a class="nav-link" href="/train">训练</a></li>
          </ul>
          <ul class="navbar-nav">
            {% if session.username %}
            <li class="nav-item"><span class="nav-link">{{ session.username }}</span></li>
            <li class="nav-item"><a class="nav-link" href="/logout">退出</a></li>
            {% else %}
            <li class="nav-item"><a class="nav-link" href="/login">登录</a></li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>
    <div class="container mt-4">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
