{% extends 'base.html' %}
{% block content %}
<h2>在线识别</h2>
<form id="frm" method="post" enctype="multipart/form-data" action="/api/classify">
  <div class="mb-3">
    <input type="file" name="file" accept="image/*" class="form-control">
  </div>
  <button class="btn btn-success" type="submit">上传并识别</button>
</form>
<div id="result" class="mt-3"></div>
<script>
const form = document.getElementById('frm');
form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd = new FormData(form);
  const resp = await fetch('/api/classify',{method:'POST',body:fd});
  const js = await resp.json();
  const el = document.getElementById('result');
  if(js.code===0){
    const d = js.data;
    el.innerHTML = `<div class="card"><div class="card-body">预测：${d.predicted_cn} (${d.predicted_class})<br>置信度：${(d.confidence*100).toFixed(2)}%<br>Top3:<ul>` + d.top3.map(t=>`<li>${t.class_cn} (${t.class_name}) - ${(t.confidence*100).toFixed(2)}%</li>`).join('') + '</ul></div></div>`
  }else{
    el.innerHTML = `<div class="alert alert-danger">${js.message||'识别失败'}</div>`
  }
});
</script>
{% endblock %}
