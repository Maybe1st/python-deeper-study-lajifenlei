{% extends 'base.html' %}
{% block content %}
<h2>数据集信息</h2>
<div id="ds"></div>
<script>
async function load(){
  const r = await fetch('/api/dashboard');
  const j = await r.json();
  if(j.code!==0) return;
  const dd = j.data.dataset_distribution||{};
  let html = '<ul>';
  for(const k in dd) html+=`<li>${k}: ${dd[k]}</li>`;
  html += '</ul>';
  document.getElementById('ds').innerHTML = html;
}
load();
</script>
{% endblock %}
